<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>NovaWeb - Digital Solutions</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
  </head>

  <body class="bg-base-100 text-base-content">
    <!-- header start -->
    <header
      class="sticky top-0 z-50 border-b border-base-300 bg-base-100/95 backdrop-blur"
    >
      <div class="navbar mx-auto w-11/12 max-w-6xl bg-base-100">
        <!-- Logo -->
        <div class="navbar-start">
          <a href="#home" class="text-2xl font-extrabold">
            Nova<span class="text-primary">Web</span>
          </a>
        </div>

        <!-- Desktop Navigation -->
        <div class="navbar-end hidden lg:flex">
          <ul class="menu menu-horizontal px-1">
            <li>
              <a href="#home"> Home </a>
            </li>

            <li>
              <a href="#about"> About </a>
            </li>

            <li>
              <a href="#services"> Services </a>
            </li>

            <li>
              <a href="#contact"> Contact </a>
            </li>
          </ul>
        </div>

        <!-- Mobile Menu -->
        <div class="navbar-end lg:hidden">
          <div class="dropdown dropdown-end">
            <!-- Hamburger Button -->
            <button
              tabindex="0"
              class="btn btn-ghost btn-square"
              aria-label="Open menu"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"
                />
              </svg>
            </button>

            <!-- Mobile Dropdown -->
            <ul
              tabindex="0"
              class="menu menu-sm dropdown-content z-50 mt-3 w-52 rounded-box bg-base-100 p-2 shadow-lg"
            >
              <li>
                <a href="#home"> Home </a>
              </li>

              <li>
                <a href="#about"> About </a>
              </li>

              <li>
                <a href="#services"> Services </a>
              </li>

              <li>
                <a href="#contact"> Contact </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </header>
    <!-- header end -->
    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
